<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AgentEd Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-agented">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-brain me-2 fs-3" style="color: #38bdf8;"></i>
                <span>AgentEd</span>
            </a>
            <div class="ms-auto">
                <a href="login.html" class="btn btn-agented-outline btn-sm">Student Login</a>
            </div>
        </div>
    </nav>

    <!-- Register Form Card -->
    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus display-4 mb-2" style="color: #0284c7;"></i>
                        <h2 class="font-heading">Create Account</h2>
                        <p class="text-muted small">Join AgentEd to unlock your personal AI learning agents</p>
                    </div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Full Name</label>
                            <input type="text" id="name" class="form-control form-control-agented" placeholder="Alex Rivera" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Email Address</label>
                            <input type="email" id="email" class="form-control form-control-agented" placeholder="alex@agented.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small">Password</label>
                            <input type="password" id="password" class="form-control form-control-agented" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-agented-primary w-100 py-2 mb-3">Complete Registration</button>
                        <div class="text-center">
                            <span class="text-muted small">Already have an account? <a href="login.html" class="text-danger fw-bold text-decoration-none">Sign in</a></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-agented text-center">
        <div class="container">
            <p class="mb-0">© 2026 AgentEd Platform. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS & App JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
