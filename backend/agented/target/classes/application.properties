# ============================================================
# AgentEd Backend Configuration
# ============================================================

server.port=8080

# Spring Application Name
spring.application.name=agented-backend

# Database Configuration (Default MySQL with fallback settings)
spring.datasource.url=jdbc:mysql://localhost:3306/agented_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Kiran123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# CORS Configuration
agented.cors.allowed-origins=*
